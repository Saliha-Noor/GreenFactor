# GreenRefactor — Benchmark Repository Configuration
# 15 open-source repos per language (120 total).
# Clone repos via: python agents/ingestion_agent.py add --language <lang> --url <url> --entrypoint <file> --name <name>
# Or bulk clone via: python agents/ingestion_agent.py bulk --manifest repos_manifest.json
#
# NOTE: entrypoints are best-guess primary source files for pattern scanning.
# Adjust per-repo after cloning if a different file is more appropriate.

python:
  patterns:
    - early_termination
    - avoid_redundant_computation
    - batch_operations
    - cache_reuse
    - offload_to_native
    - high_perf_libraries
    - high_perf_data_structures
    - swap_library_impl
  repos:
    - name: TheAlgorithms_Python
      local_path: repos/python/TheAlgorithms_Python
      entrypoint: sorts/merge_sort.py
      workload_entrypoint: workloads/python/TheAlgorithms_Python_driver.py
      url: https://github.com/TheAlgorithms/Python
    - name: requests
      local_path: repos/python/requests
      entrypoint: src/requests/adapters.py
      workload_entrypoint: workloads/python/requests_driver.py
      url: https://github.com/psf/requests
    - name: flask
      excluded: true
      exclusion_reason: "Requires a live HTTP server + client harness to exercise meaningfully; no deterministic single-process workload available."
      local_path: repos/python/flask
      entrypoint: src/flask/app.py
      url: https://github.com/pallets/flask
    - name: click
      local_path: repos/python/click
      entrypoint: src/click/core.py
      workload_entrypoint: workloads/python/click_driver.py
      url: https://github.com/pallets/click
    - name: rich
      local_path: repos/python/rich
      entrypoint: rich/console.py
      workload_entrypoint: workloads/python/rich_driver.py
      url: https://github.com/Textualize/rich
    - name: httpx
      local_path: repos/python/httpx
      entrypoint: httpx/_client.py
      workload_entrypoint: workloads/python/httpx_driver.py
      url: https://github.com/encode/httpx
    - name: faker
      local_path: repos/python/faker
      entrypoint: faker/proxy.py
      workload_entrypoint: workloads/python/faker_driver.py
      url: https://github.com/joke2k/faker
    - name: gunicorn
      excluded: true
      exclusion_reason: "Requires a live HTTP server + client harness to exercise meaningfully; no deterministic single-process workload available."
      local_path: repos/python/gunicorn
      entrypoint: gunicorn/workers/base.py
      url: https://github.com/benoitc/gunicorn
    - name: typer
      local_path: repos/python/typer
      entrypoint: typer/main.py
      workload_entrypoint: workloads/python/typer_driver.py
      url: https://github.com/tiangolo/typer
    - name: pydantic
      local_path: repos/python/pydantic
      entrypoint: pydantic/main.py
      workload_entrypoint: workloads/python/pydantic_driver.py
      url: https://github.com/pydantic/pydantic
    - name: tqdm
      local_path: repos/python/tqdm
      entrypoint: tqdm/std.py
      workload_entrypoint: workloads/python/tqdm_driver.py
      url: https://github.com/tqdm/tqdm
    - name: black
      local_path: repos/python/black
      entrypoint: src/black/__init__.py
      workload_entrypoint: workloads/python/black_driver.py
      url: https://github.com/psf/black
    - name: sqlalchemy
      local_path: repos/python/sqlalchemy
      entrypoint: lib/sqlalchemy/engine/base.py
      workload_entrypoint: workloads/python/sqlalchemy_driver.py
      url: https://github.com/sqlalchemy/sqlalchemy
    - name: scrapy
      excluded: true
      exclusion_reason: "Inherently network-bound and non-deterministic."
      local_path: repos/python/scrapy
      entrypoint: scrapy/core/engine.py
      url: https://github.com/scrapy/scrapy
    - name: tornado
      excluded: true
      exclusion_reason: "Requires a live HTTP server + client harness to exercise meaningfully; no deterministic single-process workload available."
      local_path: repos/python/tornado
      entrypoint: tornado/ioloop.py
      url: https://github.com/tornadoweb/tornado


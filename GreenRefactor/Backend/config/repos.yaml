      excluded: true
      exclusion_reason: "No isolatable refactor target without a custom multi-file build pipeline; would require Makefile/CMake integration out of scope for this project."
      # NOTE (audit): entrypoint below is still backwards relative to the Option A pattern
      # used for cJSON — it points at the driver script instead of real, scannable SQLite
      # source, and there's no separate workload_entrypoint. Deliberately left as-is because
      # this repo is excluded; if it's ever un-excluded, entrypoint must be repointed at the
      # real sqlite3.c amalgamation and this driver moved to workload_entrypoint first.
      local_path: repos/c/sqlite
      entrypoint: workloads/c/sqlite_cli.c
      workload_args:
        - ":memory:"
        - ".read workloads/c/sqlite_bench.sql"
      url: https://github.com/sqlite/sqlite
